<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniMart — Fake E-Commerce Store</title>
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">

  <!-- Header / Navigation -->
  <header class="bg-indigo-600 text-white sticky top-0 z-10 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-tight">🛍️ OmniMart <span class="text-xs bg-indigo-800 px-2 py-1 rounded text-indigo-200">DEMO</span></h1>
      <button id="cart-btn" onclick="toggleCartModal()" class="relative bg-indigo-700 hover:bg-indigo-800 px-4 py-2 rounded-lg text-sm font-semibold transition">
        🛒 Cart (<span id="cart-count">0</span>)
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
    
    <!-- Hero Banner -->
    <div class="bg-indigo-100 rounded-2xl p-6 md:p-10 mb-8 text-center">
      <h2 class="text-3xl font-extrabold text-indigo-900 mb-2">Shop Anything. Pay Nothing.</h2>
      <p class="text-indigo-700">Explore our fake product selection and test out our simulated checkout!</p>
    </div>

    <!-- Product Grid -->
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Products populated by JS -->
    </div>
  </main>

  <!-- Cart Modal -->
  <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-xl font-bold">Your Shopping Cart</h3>
        <button onclick="toggleCartModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      </div>

      <div id="cart-items" class="overflow-y-auto flex-grow my-4 divide-y">
        <!-- Cart items populated by JS -->
      </div>

      <div class="border-t pt-4">
        <div class="flex justify-between font-bold text-lg mb-4">
          <span>Total:</span>
          <span id="cart-total">$0.00</span>
        </div>
        <button onclick="openCheckoutModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-semibold transition">
          Proceed to Fake Checkout
        </button>
      </div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkout-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-xl font-bold mb-4">Simulated Checkout</h3>
      
      <form id="checkout-form" onsubmit="handleFakeOrder(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Full Name</label>
          <input type="text" required placeholder="Jane Doe" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Shipping Address</label>
          <input type="text" required placeholder="123 Fake St, City, ST" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Fake Card Number</label>
          <input type="text" required placeholder="4000 0000 0000 0000" maxlength="19" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeCheckoutModal()" class="w-1/2 border py-2.5 rounded-xl font-semibold hover:bg-gray-50">Cancel</button>
          <button type="submit" class="w-1/2 bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-xl font-semibold transition">Place Order</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // 1. Mock Catalog Data
    const products = [
      { id: 1, name: "Wireless Headphones", category: "Electronics", price: 89.99, image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" },
      { id: 2, name: "Ergonomic Desk Chair", category: "Furniture", price: 199.50, image: "https://images.unsplash.com/photo-1580481072645-022f9a6d1296?w=500" },
      { id: 3, name: "Stainless Water Bottle", category: "Lifestyle", price: 24.99, image: "https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=500" },
      { id: 4, name: "Mechanical Keyboard", category: "Electronics", price: 119.00, image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500" },
      { id: 5, name: "Minimalist Watch", category: "Fashion", price: 145.00, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" },
      { id: 6, name: "Running Sneakers", category: "Footwear", price: 79.95, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" },
      { id: 7, name: "Espresso Coffee Maker", category: "Home", price: 159.99, image: "https://images.unsplash.com/photo-1517668808822-9ebb02f2a0e6?w=500" },
      { id: 8, name: "Leather Backpack", category: "Fashion", price: 85.00, image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500" }
    ];

    let cart = [];

    // 2. Render Product Cards
    function renderProducts() {
      const grid = document.getElementById("product-grid");
      grid.innerHTML = products.map(p => `
        <div class="bg-white rounded-2xl shadow-sm border overflow-hidden flex flex-col hover:shadow-md transition">
          <img src="${p.image}" alt="${p.name}" class="h-48 w-full object-cover">
          <div class="p-4 flex flex-col flex-grow">
            <span class="text-xs font-semibold text-indigo-600 uppercase tracking-wide">${p.category}</span>
            <h3 class="font-bold text-gray-900 mt-1 mb-2">${p.name}</h3>
            <div class="mt-auto flex justify-between items-center">
              <span class="text-lg font-extrabold text-gray-900">$${p.price.toFixed(2)}</span>
              <button onclick="addToCart(${p.id})" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-3 py-1.5 rounded-lg font-medium transition">
                + Add
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // 3. Cart Operations
    function addToCart(productId) {
      const item = cart.find(i => i.id === productId);
      if (item) {
        item.qty++;
      } else {
        const product = products.find(p => p.id === productId);
        cart.push({ ...product, qty: 1 });
      }
      updateCartUI();
    }

    function removeFromCart(productId) {
      cart = cart.filter(i => i.id !== productId);
      updateCartUI();
    }

    function updateCartUI() {
      // Update count badge
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById("cart-count").innerText = count;

      // Update cart modal list
      const itemsContainer = document.getElementById("cart-items");
      if (cart.length === 0) {
        itemsContainer.innerHTML = `<p class="text-center text-gray-400 py-8">Your cart is empty.</p>`;
      } else {
        itemsContainer.innerHTML = cart.map(item => `
          <div class="py-3 flex justify-between items-center">
            <div>
              <p class="font-bold text-sm">${item.name}</p>
              <p class="text-xs text-gray-500">$${item.price.toFixed(2)} × ${item.qty}</p>
            </div>
            <div class="flex items-center gap-3">
              <span class="font-bold text-sm">$${(item.price * item.qty).toFixed(2)}</span>
              <button onclick="removeFromCart(${item.id})" class="text-red-500 hover:text-red-700 text-xs font-semibold">Remove</button>
            </div>
          </div>
        `).join('');
      }

      // Update total
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById("cart-total").innerText = `$${total.toFixed(2)}`;
    }

    // 4. Modal Toggles
    function toggleCartModal() {
      document.getElementById("cart-modal").classList.toggle("hidden");
    }

    function openCheckoutModal() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }
      toggleCartModal();
      document.getElementById("checkout-modal").classList.remove("hidden");
    }

    function closeCheckoutModal() {
      document.getElementById("checkout-modal").classList.add("hidden");
    }

    // 5. Fake Order Submission
    function handleFakeOrder(event) {
      event.preventDefault();
      closeCheckoutModal();
      
      // Simulate API processing delay
      setTimeout(() => {
        alert("🎉 Fake order placed successfully! No actual money was charged.");
        cart = [];
        updateCartUI();
      }, 300);
    }

    // Initialize product grid on load
    renderProducts();
  </script>
</body>
</html>
